site_name: GoNFE
site_description: Biblioteca Go para emissão de documentos fiscais eletrônicos brasileiros
site_author: mschunke
site_url: https://mschunke.github.io/gonfe/
repo_url: https://github.com/mschunke/gonfe
repo_name: mschunke/gonfe
edit_uri: edit/main/docs/
copyright: Distribuído sob a licença MIT

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  features:
    # navigation.instant sai de propósito: ele quebra o link contextual do
    # seletor de idioma, que passaria a mandar todo mundo para a página
    # inicial do outro idioma em vez da página equivalente.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir o sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Tema claro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Tema escuro

nav:
  - Início: index.md
  - Começando:
      - Instalação: instalacao.md
      - Primeira nota: primeira-nota.md
      - Certificado digital: certificado.md
  - Guias:
      - Emissão de NF-e: nfe.md
      - Emissão de NFC-e: nfce.md
      - Eventos: eventos.md
      - CT-e e MDF-e: transporte.md
      - Distribuição de DF-e: distribuicao.md
      - Documentos auxiliares: danfe.md
      - Assinatura digital: assinatura.md
      - Serviços da SEFAZ: sefaz.md
      - Valores decimais: decimais.md
      - Validação: validacao.md
      - Testes em homologação: homologacao.md
  - Referência:
      - Pacotes: pacotes.md
      - Perguntas frequentes: faq.md
  - Contribuindo: contribuindo.md

plugins:
  - search
  # O espelho em inglês vive ao lado do português, no mesmo diretório: cada
  # página tem um par com sufixo .en. O português é o padrão, e uma página
  # ainda não traduzida cai nele em vez de sumir do site.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          default: true
          name: Português
          build: true
        - locale: en
          name: English
          build: true
          site_description: Go library for issuing Brazilian electronic fiscal documents
          nav_translations:
            Início: Home
            Começando: Getting started
            Instalação: Installation
            Primeira nota: Your first invoice
            Certificado digital: Digital certificate
            Guias: Guides
            Emissão de NF-e: Issuing an NF-e
            Emissão de NFC-e: Issuing an NFC-e
            Eventos: Events
            CT-e e MDF-e: CT-e and MDF-e
            Distribuição de DF-e: DF-e distribution
            Documentos auxiliares: Auxiliary documents
            Assinatura digital: Digital signature
            Serviços da SEFAZ: SEFAZ web services
            Valores decimais: Decimal values
            Validação: Validation
            Testes em homologação: Testing against homologation
            Referência: Reference
            Pacotes: Packages
            Perguntas frequentes: FAQ
            Contribuindo: Contributing

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Sem esta extensão os atalhos de ícone (:material-…:, :octicons-…:) saem
  # como texto cru no lugar do desenho.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mschunke/gonfe
      name: Código no GitHub
    - icon: fontawesome/solid/book
      link: https://pkg.go.dev/github.com/mschunke/gonfe
      name: Referência da API no pkg.go.dev
